backend: pc
engine:
  type: siglip
  model_name: "ViT-L-16-SigLIP-256"
  pretrained: "webli"
  device: null        # auto-detect (cuda if available)
  batch_size: 16
  frames_per_window: 5

pipeline:
  video_backend: opencv
  window_sec: 5.0
  overlap_ratio: 0.50

index:
  embed_dim: 1024
  index_dir: ./index_store_siglip

search:
  top_k: 5
  score_threshold: 0.20
  nms_iou_threshold: 0.30
  adaptive_threshold: true
  translate_vi: false   # SigLIP natively multilingual — no translation needed
