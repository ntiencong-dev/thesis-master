# config/pc_internvideo2.yaml
# InternVideo2-CLIP-1B engine configuration (Phase 3)
# VRAM: ~2.2 GB FP16 on GTX 1650 Ti (4 GB)
# MSR-VTT R@1: 57.2% (best feasible model for this hardware)
# Reference: RESEARCH_SOTA_NLVS.md §III2

engine:
  type: internvideo2
  model_name: "OpenGVLab/InternVideo2-CLIP-1B-224p-f8"
  device: null          # null = auto-detect
  batch_size: 4
  frames_per_window: 8  # InternVideo2-1B f8 → 8 temporal frames
  load_in_8bit: false   # set true to save ~1 GB VRAM (requires bitsandbytes)

pipeline:
  video_backend: opencv
  window_sec: 5.0
  overlap_ratio: 0.50

index:
  embed_dim: 768          # ViT-L CLIP output dimension
  index_dir: ./index_store_internvideo2
  index_type: flat        # "flat" | "ivf"

search:
  top_k: 5
  score_threshold: 0.20
  nms_iou_threshold: 0.30
  adaptive_threshold: true
  translate_vi: true
