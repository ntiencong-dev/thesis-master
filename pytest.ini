[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: Pure unit tests (no CUDA, no disk I/O)
    integration: Tests that use CLIP model or real video file
    api: FastAPI endpoint tests
    slow: Tests that take > 30 s
